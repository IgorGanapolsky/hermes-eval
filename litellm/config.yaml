# Hermes fleet gateway — LiteLLM proxy.
#   litellm --config litellm/config.yaml --port 4010   (4000 is occupied on this box)
# Verified against LiteLLM v1.89.0 docs (2026-06) + the live Ollama models on this Mac Pro.
# "Hermes everywhere" = the Mac Pro + Mac mini both appear as `hermes-local` deployments,
# so the SAME model load-balances across both machines; a dead node is auto-benched.

model_list:
  # ---- PRIMARY: best local model, one entry per machine => true cross-host load-balance ----
  # 2026-08-05 high-ROI: qwen3:8b-64k measured p50~120s / near-zero useful tokens (fleet note).
  # Prefer qwen2.5:3b-64k for hermes-local emergency/offline rung (smoke-tested smaller, coexists with embedder).
  - model_name: hermes-local
    litellm_params:
      model: ollama/qwen2.5:3b-64k
      api_base: http://127.0.0.1:11434          # Mac Pro (this box)
      num_ctx: 65536
      keep_alive: "15m"
      rpm: 60
    model_info: {mode: chat, base_model: qwen2.5, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 65536, max_output_tokens: 8192}

  # Mac mini Tailscale hermes-local REMOVED 2026-08-05: offline mini hangs LB requests
  # until cool-down; re-add only when 100.94.135.78:11436 health-probes green.

  # hermes-local-fast REMOVED 2026-08-05: same ollama target as hermes-local but hung (0-byte timeout).
  # Use model name hermes-local for all offline emergency rungs — zero dual-alias debt.

  - model_name: omlx-local
    litellm_params:
      model: openai/Llama-3.2-3B-Instruct-4bit
      api_base: http://127.0.0.1:8011/v1
      api_key: omlx
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 131072, max_output_tokens: 8192}


  # ---- Mini-only HEAVY coder model: 14B won't fit the Mac Pro's RAM budget, but the mini has it.
  #      Reached over Tailscale. Opt-in (model: "hermes-coder") for hard coding; NOT in the auto-fallback. ----
  - model_name: hermes-coder
    litellm_params:
      model: ollama/qwen2.5-coder:14b-64k
      api_base: http://100.94.135.78:11436        # Mac mini over Tailscale
      num_ctx: 65536
      keep_alive: "10m"
      rpm: 20
    model_info: {mode: chat, base_model: qwen2.5-coder-14b, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 65536, max_output_tokens: 8192}

  # ---- Cross-family local model. Also the eval JUDGE (different family than qwen) ----
  - model_name: hermes-gemma
    litellm_params:
      model: openai/gemma4-12b,gpu               # LiteRT OpenAI-compatible server
      api_base: http://127.0.0.1:9379/v1
      api_key: "none"
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 32768, max_output_tokens: 8192}

  # ---- PRIMARY CLOUD: GLM-5.3 via the z.ai Coding Plan SUBSCRIPTION (flat monthly, already paid).
  #      2026-08-15: GLM-5.3 launched on the Coding Plan (zai.pdf; SCMP 3364077) — now the flagship
  #      default. Igor pays for this monthly — use it, not per-token OpenRouter. Rate-capped
  #      (historic 429s) => falls back through the chain below. GLM-5.3 reasons heavily; give it
  #      tokens. NOTE: 5.3 is premium-tier like 5.2 — watch the 5h/weekly prompt quota
  #      (hermes-paid-route-watch); routine/background traffic still belongs on glm-47. ----
  - model_name: glm-coding
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 45                               # bound a blackholed/slow z.ai so failover to local is fast (was unbounded=120s router default x retries ≈ minutes). 45s covers normal GLM reasoning; a stuck call fails over to hermes-local. Verified 2026-07-04.
    model_info: {mode: chat, max_input_tokens: 1000000, max_output_tokens: 128000}   # 1M ctx / 128K out per docs.z.ai — lets pre_call_checks route oversized prompts here

  # In-group Together + Laguna: streaming + enable_pre_call_checks 429s with
  # "No deployments available" when the ONLY glm-coding deployment (z.ai) is in
  # cooldown. Same model_name = the group still has a live pool (2026-08-24 desktop).
  - model_name: glm-coding
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}
  - model_name: glm-coding
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 262144, max_output_tokens: 8192}

  # ---- GLM-5.3 explicit alias (2026-08-15): same coding-plan deployment as glm-coding so
  #      direct `model: glm-5.3` requests (router glm53_coding route, bin/glm-5.3) resolve here.
  #      Fallback chain steps down to glm-5.2 on the SAME subscription first, then the free rungs.
  #      NOTE: OpenRouter z-ai/glm-5.3 does NOT exist yet (verified /v1/models 2026-08-15) — do
  #      not point fallbacks at it; z-ai/glm-5.2 is the closest metered OpenRouter rung. ----
  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 1000000, max_output_tokens: 128000}
  - model_name: glm-5.3
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}
  - model_name: glm-5.3
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 262144, max_output_tokens: 8192}

  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 45                               # bound a blackholed/slow z.ai so failover to local is fast (was unbounded=120s router default x retries ≈ minutes). 45s covers normal GLM reasoning; a stuck call fails over to hermes-local. Verified 2026-07-04.
    model_info: {mode: chat, max_input_tokens: 1000000, max_output_tokens: 128000}   # 1M ctx / 128K out per docs.z.ai — lets pre_call_checks route oversized prompts here
  - model_name: glm-5.2
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}

  # ---- ECONOMY ROUTE on the SAME z.ai subscription: GLM-4.7 at the STANDARD rate.
  #      z.ai bills the Coding Plan in PROMPTS, not tokens (docs.z.ai/devpack/faq: one prompt
  #      "typically allows 15-20 model calls"), and only the PREMIUM models (GLM-5.2, GLM-5-Turbo)
  #      carry the multiplier — "3 times the standard rate during peak hours and 2 times during
  #      off-peak" (1x off-peak under a promo running through Sept 2026). z.ai's own FAQ recommends
  #      GLM-4.7 for routine tasks "to avoid depleting your plan's usage quota too quickly".
  #      So: routine/background/automated work belongs HERE; glm-coding (5.2) stays for hard
  #      interactive work. The weekly cap blew on 2026-07-28 (reset 2026-08-01 21:07) and took the
  #      fleet down for 4 days, so this split is the difference between capped and not.
  #      Same key, same subscription, no extra spend. `glm-4.7` is confirmed present on the coding
  #      endpoint's /models list. NOT yet live-verified for tool-calling: the subscription is capped
  #      until Aug 1, so every call currently falls through to nemotron3-free. Verify with a real
  #      tool-call after the reset BEFORE adding it to competence_probe.py's COMPETENT_MARKERS or
  #      pointing automated traffic at it — this repo does not ship paper fallbacks.
  #      Its chain deliberately omits glm-coding: escalating the cheap route to the 3x model would
  #      defeat the whole point.
  - model_name: glm-47
    litellm_params:
      model: openai/glm-4.7
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 45
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}

  # ---- VISION: GLM-4.6V multimodal via the SAME z.ai subscription. Powers hermes computer_use
  #      (reads screenshots) + image inputs. Verified 2026-07-09: read "HERMES42" from a PNG. ----
  - model_name: glm-vision
    litellm_params:
      model: openai/glm-4.6v
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 60
    model_info: {mode: chat, supports_vision: true, max_input_tokens: 65536, max_output_tokens: 8192}

  # ---- VISION FALLBACKS. glm-vision rides the same z.ai subscription as glm-coding, so ONE
  #      5-hour usage cap takes both down at once — and since image-bearing requests are routed
  #      here (hermes_logger.route_image_request_to_vision), a capped sub used to leave every
  #      screenshot session retrying a hard 429 with "No fallback model group found" while text
  #      sessions failed over fine (hit live 2026-07-25, cap reset 02:07). Both routes below were
  #      verified reading a real PNG before wiring — no paper fallbacks (muse-spark is NOT here:
  #      it 401s, see the route below). Different provider AND different quota pool, so a z.ai
  #      cap cannot take them with it. ----
  # FIRST fallback, ahead of the free 12B: Gemini 2.5 Flash is a frontier-class VLM with a 1M
  # window on Google's FREE tier, and the key was already sitting in ~/.hermes/.env unused —
  # a capped z.ai was degrading image work to a 12B when this was available at $0 the whole
  # time. Free tier = rate limits, not per-token billing, so it cannot burn money (the $175
  # OpenRouter incident rule still holds: no metered route in an auto chain).
  - model_name: vision-gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45
    model_info: {mode: chat, supports_vision: true, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 1048576, max_output_tokens: 8192}

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      timeout: 45
    model_info: {mode: chat, supports_vision: true, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 1048576, max_output_tokens: 8192}

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
      timeout: 60
    model_info: {mode: chat, supports_vision: true, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 2097152, max_output_tokens: 8192}

  - model_name: vision-free
    litellm_params:
      model: openrouter/nvidia/nemotron-nano-12b-v2-vl:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info: {mode: chat, supports_vision: true, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 128000, max_output_tokens: 8192}

  # Last resort: local, so it survives BOTH a z.ai cap and an OpenRouter free-tier 429 (gemma-4
  # was already 429ing when this was wired). 4B is below the fleet's "no tiny silent fallback"
  # bar for CODING, but this route only ever answers "what is in this image" after two real VLMs
  # have failed — and a slow local read beats a dead session. ~15s/image, no quota, no cost.
  - model_name: vision-local
    litellm_params:
      model: ollama/qwen3-vl:4b-instruct
      api_base: http://127.0.0.1:11434
      keep_alive: "15m"
      timeout: 90
    model_info: {mode: chat, base_model: qwen2-vl-7b-instruct, supports_vision: true, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 32768, max_output_tokens: 4096}

  # ---- NVIDIA Nemotron Super 49B via NIM (build.nvidia.com). OPT-IN by name (model: "nemotron");
  #      NOT in the auto-fallback chain — it's PER-TOKEN cloud, so it must not silently replace the
  #      flat GLM sub. Verified 2026-07-09: tool-calls correctly. Use for hard agentic/coding when
  #      you want a non-GLM opinion. Nemotron reasons heavily -> give it ≥1024 max_tokens. ----
  - model_name: nemotron
    litellm_params:
      model: openai/nvidia/llama-3.3-nemotron-super-49b-v1.5
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 131072, max_output_tokens: 8192}

  # ---- NVIDIA Nemotron 3 Ultra 550B via OpenRouter FREE tier. Wired into the auto-fallback
  #      chain (below) between cloud-fallback and hermes-local. Rationale: the 2026-07-09 outage
  #      (see fallbacks note) had both GLM routes fail and agents silently loop on qwen3:8b for
  #      hours. This is a strong, tool-calling model that FAILS HARD instead of degrading-200, so
  #      it belongs ahead of local. FREE tier => no per-token cost, so unlike `nemotron` (NIM,
  #      per-token) it is safe to automate. Verified tool-calling 2026-07-10 before wiring. ----
  - model_name: nemotron3-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 131072, max_output_tokens: 8192}

  # ---- Poolside Laguna S 2.1 via OpenRouter FREE tier (118B/8B-active, coding-specialized;
  #      SWE-Bench Multilingual 78.5%, SWE-Bench Pro public 59.4% per Poolside's 2026-07-21
  #      release). Verified tool-calling 2026-07-23 (structured tool_calls, cost:0) before
  #      wiring into the auto-fallback chain below, same bar as nemotron3-free. Same
  #      OpenRouter account/key as nemotron3-free — a rate-limit or outage on that key
  #      affects both, so this adds model diversity (coding-specialized vs general-purpose),
  #      not provider diversity. ----
  - model_name: laguna-free
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 262144, max_output_tokens: 8192}   # :free variant caps at 262144 per OpenRouter's live /api/v1/models (verified 2026-07-24); 1048576 is the paid variant's window, not this one's

  # ---- OpenCode Zen FREE tier (opencode.ai gateway; account = Google SSO, key in
  #      ~/.hermes/.env, NO billing enabled — free models only, $0). Wired 2026-07-17 as a
  #      SECOND free pre-local rung in the auto-fallback chain (different provider infra
  #      than the OpenRouter :free route, so one gateway outage can't kill both).
  #      Paid Zen models (glm-5.2 $1.40/$4.40, kimi-k2.7-code $0.95/$4.00) and the Go
  #      $10/mo flat sub (second glm-5.2 quota pool) unlock after Igor enables billing —
  #      keep those OUT of auto-fallbacks like every per-token route. ----
  - model_name: opencode-free
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 131072, max_output_tokens: 8192}

  # ---- DeepSeek V4-Flash-0731 (agent post-train, MIT open weights 2026-08-03).
  #      Named agent-capable alias for hermes-yolo fail-closed routing. Same Zen free
  #      endpoint as opencode-free; keep both names so fallbacks + explicit HERMES_YOLO_MODEL
  #      can target deepseek-v4-flash without resolving laguna/nemotron free first. ----
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_API_KEY
      timeout: 45
    model_info: {mode: chat, input_cost_per_token: 0, output_cost_per_token: 0, max_input_tokens: 131072, max_output_tokens: 8192}

  # ---- OpenCode GO (flat $10/mo sub, ACTIVE since 2026-07-17): SAME glm-5.2 from an
  #      INDEPENDENT quota pool (880 req/5h) => the no-quality-drop first fallback when
  #      z.ai 429s. kimi-k2.7-code also included. Caps: $12/5h value — fallback leg,
  #      not co-primary. ----
  - model_name: opencode-go-glm
    litellm_params:
      model: openai/glm-5.2
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}

  # ---- Kimi Code FLAT-RATE membership (Allegretto $39/mo, upgraded 2026-07-28 from
  #      Moderato $19). sk-kimi-* console key, api.kimi.com/coding/v1.
  #      kimi-for-coding = K2.7 Code (262K). Allegretto ≈5x Moderato quota + unlocks
  #      full 1M ctx on k3 (see kimi-code-k3). Flat sub => SAFE for auto-fallback
  #      (unlike per-token kimi-coding on Moonshot). Live-proven completion+tool-call
  #      2026-07-28 → joined glm-coding fallback chain. ----
  - model_name: kimi-code
    litellm_params:
      model: openai/kimi-for-coding
      api_base: https://api.kimi.com/coding/v1
      api_key: os.environ/KIMI_CODE_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 262144, max_output_tokens: 16384}

  # ---- High-speed variant on the SAME Kimi Allegretto flat subscription (no extra spend,
  #      same KIMI_CODE_API_KEY). Opt-in by name only, exactly as on the mac mini, which
  #      already carried this route — added here 2026-07-31 to bring the MacBook Pro to
  #      parity after an audit found the two machines' configs had diverged. Deliberately
  #      NOT in any auto chain: kimi-code is the quality rung, this is for latency-bound
  #      work someone opts into. ----
  - model_name: kimi-code-fast
    litellm_params:
      model: openai/kimi-for-coding-highspeed
      api_base: https://api.kimi.com/coding/v1
      api_key: os.environ/KIMI_CODE_API_KEY
      timeout: 60
    model_info: {mode: chat, base_model: kimi-k2.7, max_input_tokens: 262144, max_output_tokens: 16384}

  - model_name: opencode-go-kimi
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY
      timeout: 60
    model_info: {mode: chat, base_model: kimi-k2.7, max_input_tokens: 262144, max_output_tokens: 16384}

  # ---- Kimi K2.7 Code via the Moonshot platform (PER-TOKEN — existing key verified
  #      2026-07-17: GET /models lists kimi-k2.7-code, 262K ctx). Top open-source coding
  #      model (SWE-bench Verified 60.4%). OPT-IN by name like nemotron; NOT in the
  #      auto-fallback chain — per-token must not silently replace the flat GLM sub.
  #      A flat-rate membership route (api.kimi.com, sk-kimi-* console key) can be added
  #      as `kimi-code` once a Kimi Code console key exists; THAT one is the
  #      quota-diversification fallback candidate. ----
  - model_name: kimi-coding
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/MOONSHOT_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 262144, max_output_tokens: 16384}

  # ---- Kimi K3 (July 2026 open-weight flagship, 2.8T MoE, 1M ctx). API id `kimi-k3`
  #      on Moonshot (PER-TOKEN ~$3/$15 per M — opt-in BY NAME ONLY). Do NOT add to
  #      auto-fallback chains. Weights: huggingface.co/moonshotai/Kimi-K3 — NOT runnable
  #      on Mac Pro/mini (multi-node). Flat-rate membership aliases below when quota allows.
  #      Source: Threads @vaibhavsisinty + platform.kimi.ai/docs/guide/kimi-k3-quickstart
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/MOONSHOT_API_KEY
      timeout: 180
    model_info: {mode: chat, max_input_tokens: 1048576, max_output_tokens: 131072}

  # ---- Kimi Code membership K3 routes (api.kimi.com/coding). Allegretto $39+ unlocks
  #      full 1M on `k3`; `k3-256k` is the smaller alias. Flat-rate membership quota.
  #      kimi-code-k3 is the context-window overflow target (1M). Live-proven 2026-07-28. ----
  - model_name: kimi-code-k3
    litellm_params:
      model: openai/k3
      api_base: https://api.kimi.com/coding/v1
      api_key: os.environ/KIMI_CODE_API_KEY
      timeout: 45
    model_info: {mode: chat, max_input_tokens: 1048576, max_output_tokens: 131072}

  - model_name: kimi-code-k3-256k
    litellm_params:
      model: openai/k3-256k
      api_base: https://api.kimi.com/coding/v1
      api_key: os.environ/KIMI_CODE_API_KEY
      timeout: 120
    model_info: {mode: chat, max_input_tokens: 262144, max_output_tokens: 65536}

  # ---- Same subscription, lighter/faster model: GLM-5-Turbo (200K ctx). Verified live on the
  #      coding endpoint 2026-07-02. Also reasons heavily — give it ≥300 max_tokens. ----
  - model_name: glm-turbo
    litellm_params:
      model: openai/glm-5-turbo
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/Z_AI_API_KEY
      timeout: 45                               # same fast-failover bound as glm-coding
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}
  - model_name: glm-turbo
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}

  # ---- Cloud fallback (paid PER-TOKEN). Only when the subscription is unreachable/quota-capped ----
  # ---- Meta Muse Spark 1.1 via Meta Model API (added 2026-07-13). $20 free credits then
  #      $1.25/M in, $4.25/M out — cheapest capable tool-calling tier on the fleet. 1M ctx,
  #      multimodal, reasoning model (needs generous max_tokens). OPT-IN by name for now;
  #      candidate to precede the per-token NIM route in fallbacks once proven under load. ----
  - model_name: muse-spark
    litellm_params:
      model: openai/muse-spark-1.1
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_MODEL_API_KEY
      timeout: 90
    model_info: {mode: chat, max_input_tokens: 1000000, max_output_tokens: 16384}

  - model_name: cloud-fallback
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 4096                          # low OpenRouter balance: Hermes asks for 65536 out-tokens and OpenRouter 402s the whole call ("can only afford ~6K") — cap so the LAST-RESORT route actually serves instead of dying (seen 2026-07-07 during z.ai quota exhaustion)
    model_info: {mode: chat, max_output_tokens: 4096}

  # ---- Embeddings for the eval `similar` (cosine) assertion ----
  - model_name: text-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://127.0.0.1:11434
    model_info: {mode: embedding}

  # ---- OPTIONAL escalation tier: Sakana fugu-ultra. OFF by default (in NO fallback chain).
  #      Invoke deliberately with model: "escalation" for genuinely hard coding/research.
  #      $5/$30 per 1M + billed orchestration tokens + slow + EU-blocked. See fugu-ultra-evaluation memory.
  - model_name: escalation
    litellm_params:
      model: openrouter/sakana/fugu-ultra
      api_key: os.environ/OPENROUTER_API_KEY
    model_info: {mode: chat}

  # ---- Together.ai serverless (PER-TOKEN, key verified live 2026-07-19: 272 models,
  #      272-model catalog incl. Inkling/GLM-5.2/Kimi/DeepSeek). OPT-IN BY NAME ONLY —
  #      per-token, so kept OUT of every auto-fallback chain like kimi-coding/nemotron.
  #      `together-inkling` is the Inkling escalation route: $1.00/$4.05 per 1M —
  #      CHEAPER than the first-party Tinker route (see fleet-autonomy-research-2026-07).
  #      Inkling is a REASONING model → give it ≥900 max_tokens or content returns empty. ----
  - model_name: together-inkling
    litellm_params:
      model: openai/thinkingmachines/Inkling
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 90
    model_info: {mode: chat, max_input_tokens: 262144, max_output_tokens: 8192}

  # ---- Together GLM-5.2: SAME model as the flat z.ai/OpenCode routes but a THIRD,
  #      independent quota pool → a manual cross-provider fallback for the documented
  #      triple-quota-exhaustion day (2026-07-12). Per-token → opt-in by name, NOT auto. ----
  - model_name: together-glm
    litellm_params:
      model: openai/zai-org/GLM-5.2
      api_base: https://api.together.xyz/v1
      api_key: os.environ/TOGETHER_API_KEY
      timeout: 60
    model_info: {mode: chat, max_input_tokens: 200000, max_output_tokens: 128000}

router_settings:
  routing_strategy: latency-based-routing       # auto-prefers the fastest live box
  num_retries: 1                                 # 1 retry (was 2): a down subscription endpoint won't recover on retry, so fewer retries => faster failover to local. Transient blips still get one retry.
  timeout: 120                                   # local 8b @ 64k ctx can be slow (cloud GLM models set their own 45s timeout for fast failover)
  allowed_fails: 1
  cooldown_time: 8                               # 45s glm cooldown + streaming = desktop "No deployments available" (2026-08-24)
  enable_pre_call_checks: true                  # oversized prompt => bigger-ctx / cloud
  default_fallbacks: ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]
  fallbacks: [{"glm-coding": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"glm-5.3": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"glm-5.2": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"glm-turbo": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"glm-47": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"hermes-local": ["together-glm", "laguna-free"]}, {"glm-vision": ["vision-gemini", "vision-local"]}, {"kimi-code": ["together-glm", "laguna-free", "nemotron3-free", "hermes-local"]}, {"opencode-go-kimi": ["together-glm", "laguna-free", "hermes-local"]}, {"kimi-code-k3": ["together-glm", "laguna-free", "hermes-local"]}, {"deepseek-v4-flash": ["together-glm", "laguna-free", "hermes-local"]}, {"opencode-free": ["together-glm", "laguna-free", "hermes-local"]}, {"opencode-go-glm": ["together-glm", "laguna-free", "hermes-local"]}, {"vision-free": ["vision-gemini", "vision-local"]}, {"cloud-fallback": ["together-glm", "laguna-free", "hermes-local"]}]
  context_window_fallbacks: [{"hermes-local": ["together-glm", "kimi-code-k3"]}, {"glm-turbo": ["together-glm", "kimi-code-k3"]}, {"kimi-code": ["together-glm", "kimi-code-k3"]}, {"kimi-code-k3": ["together-glm"]}, {"glm-vision": ["vision-gemini", "vision-local"]}]
  content_policy_fallbacks: [{"glm-coding": ["hermes-local"]}, {"glm-turbo": ["hermes-local"]}]   # provider content-policy refusal => local model (separate trigger class per LiteLLM reliability docs)

litellm_settings:
  drop_params: true                             # tolerate provider-specific params
  callbacks: hermes_logger.proxy_handler_instance   # append every call to JSONL = golden-set / drift feed
  # callbacks: ["prometheus"]                   # (needs prometheus_client) -> GET /metrics

general_settings:
  background_health_checks: false   # off: don't waste ~28s probing the down LiteRT/offline mini; on-demand cooldown still protects fallbacks
  health_check_interval: 120
  # --- Turn these on with a Postgres URL: this is what builds the golden-set / drift dataset ---
  # database_url: os.environ/DATABASE_URL
  # store_prompts_in_spend_logs: true
